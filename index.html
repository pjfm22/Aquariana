<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Especial</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #020617, #0f172a);
    font-family: Arial, sans-serif;
    color: white;
}

/* carta */
.carta {
    width: 80%;
    max-width: 300px;
    height: 160px;
    background: #f8fafc;
    color: #111;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* botão */
button {
    padding: 14px 22px;
    border: none;
    border-radius: 25px;
    background: #38bdf8;
    color: #020617;
    font-weight: bold;
    font-size: 15px;
}

/* conteúdo */
#conteudo {
    display: none;
    width: 90%;
    max-width: 400px;
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

#texto {
    white-space: pre-wrap;
    line-height: 1.6;
}

/* botão final */
#finalBtn {
    display: none;
    margin-top: 20px;
    width: 100%;
}
</style>
</head>

<body>

<div class="carta">💌 Carta Especial</div>

<button id="abrir">Abrir Carta</button>

<div id="conteudo">
    <div id="texto"></div>
    <button id="finalBtn">Quero continuar isso com você</button>
</div>

<audio id="musica" src="Ainda Flui.mp3"></audio>

<script>
const abrir = document.getElementById("abrir");
const conteudo = document.getElementById("conteudo");
const texto = document.getElementById("texto");
const musica = document.getElementById("musica");
const finalBtn = document.getElementById("finalBtn");

const mensagem = `Em poucos dias, a gente criou algo raro — e o mais bonito é sentir que isso ainda tá só começando.
Com muito carinho, P.S: fica até a música acabar`;

abrir.onclick = function() {
    let senha = prompt("Digite a senha:");

    if (senha === "Aquariana") {
        abrir.style.display = "none";
        document.querySelector(".carta").style.display = "none";
        conteudo.style.display = "block";

        musica.play();
        digitarTexto();
    } else {
        alert("Senha incorreta 💔");
    }
};

function digitarTexto() {
    let i = 0;

    function escrever() {
        if (i < mensagem.length) {
            texto.innerHTML += mensagem[i];
            i++;
            setTimeout(escrever, 50);
        } else {
            finalBtn.style.display = "block";
        }
    }

    escrever();
}

finalBtn.onclick = function() {
    window.location.href = "https://wa.me/5542998759922?text=Eu quero continuar isso com você 💙";
};
</script>

</body>
</html>
