<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Especial</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Courier New', monospace;
    background: radial-gradient(circle at center, #020617, #000);
    color: white;
    overflow: hidden;
}

/* estrelas (não bloqueia clique) */
.stars {
    position: fixed;
    width: 200%;
    height: 200%;
    background: url("https://www.transparenttextures.com/patterns/stardust.png");
    animation: moveStars 60s linear infinite;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
}

@keyframes moveStars {
    from { transform: translate(0,0); }
    to { transform: translate(-500px,-500px); }
}

/* carta */
.carta {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    max-width: 300px;
    height: 160px;
    background: #f8fafc;
    color: #111;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    z-index: 10;
}

/* animação abrir */
.abrindo {
    animation: abrir 1.2s forwards;
}

@keyframes abrir {
    to { transform: translate(-50%, -50%) scale(2); opacity: 0; }
}

/* conteúdo */
.conteudo {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 420px;
    background: rgba(2,6,23,0.9);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    z-index: 20;
}

#texto {
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
}

/* botão */
.botao {
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #38bdf8;
    color: #020617;
    font-weight: bold;
    cursor: pointer;
    display: none;
    width: 100%;
}

/* fade final */
.fade {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    transition: 2s;
    z-index: 50;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="carta" id="carta">Abrir Carta 💌</div>

<div class="conteudo" id="conteudo">
    <div id="texto"></div>
    <button class="botao" id="botao">Quero continuar isso com você</button>
</div>

<div class="fade" id="fade"></div>

<audio id="musica" src="Ainda Flui.mp3"></audio>

<script>
const carta = document.getElementById("carta");
const conteudo = document.getElementById("conteudo");
const textoEl = document.getElementById("texto");
const musica = document.getElementById("musica");
const botao = document.getElementById("botao");
const fade = document.getElementById("fade");

const mensagem = `Em poucos dias, a gente criou algo raro — e o mais bonito é sentir que isso ainda tá só começando.
Com muito carinho, P.S: fica até a música acabar`;

carta.addEventListener("click", () => {
    let senha = prompt("Digite a senha:");

    if (senha === "Aquariana") {
        carta.classList.add("abrindo");

        setTimeout(() => {
            carta.style.display = "none";
            conteudo.style.display = "block";

            musica.play();
            digitar(mensagem);
        }, 1200);
    } else {
        alert("Senha incorreta 💔");
    }
});

function digitar(texto) {
    let i = 0;

    function escrever() {
        if (i < texto.length) {
            textoEl.innerHTML += texto[i];
            i++;
            setTimeout(escrever, 50);
        } else {
            botao.style.display = "block";
        }
    }

    escrever();
}

botao.addEventListener("click", () => {
    fade.style.opacity = 1;

    setTimeout(() => {
        window.location.href = "https://wa.me/5542998759922?text=Eu quero continuar isso com você 💙";
    }, 2000);
});
</script>

</body>
</html>
