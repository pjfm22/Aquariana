<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Especial</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Courier New', monospace;
    background: radial-gradient(circle at center, #020617, #000);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* estrelas */
.stars {
    position: fixed;
    width: 200%;
    height: 200%;
    background: url("https://www.transparenttextures.com/patterns/stardust.png");
    animation: moveStars 60s linear infinite;
    opacity: 0.25;
    pointer-events: none;
}

@keyframes moveStars {
    from { transform: translate(0,0); }
    to { transform: translate(-500px,-500px); }
}

/* carta */
.carta {
    width: 80%;
    max-width: 300px;
    height: 160px;
    background: #f8fafc;
    color: #111;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    margin-bottom: 20px;
}

/* botão abrir com brilho */
.abrir-btn {
    position: relative;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #38bdf8;
    color: #020617;
    font-weight: bold;
    cursor: pointer;
    overflow: hidden;
}

.abrir-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    transition: 0.5s;
}

.abrir-btn:hover::after {
    left: 100%;
}

/* conteúdo */
.conteudo {
    display: none;
    opacity: 0;
    transform: translateY(20px);
    width: 90%;
    max-width: 420px;
    background: rgba(2,6,23,0.95);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    transition: 1s;
}

.conteudo.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
}

#texto {
    white-space: pre-wrap;
    line-height: 1.6;
}

/* botão final */
.botao {
    margin-top: 20px;
    padding: 12px;
    border-radius: 25px;
    border: none;
    background: #38bdf8;
    color: #020617;
    font-weight: bold;
    display: none;
    width: 100%;
}

/* fade */
.fade {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    transition: 2s;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="carta">💌 Carta Especial</div>

<button class="abrir-btn" id="abrirBtn">Abrir Carta</button>

<div class="conteudo" id="conteudo">
    <div id="texto"></div>
    <button class="botao" id="botao">Quero continuar isso com você</button>
</div>

<div class="fade" id="fade"></div>

<!-- música principal -->
<audio id="musica" src="Ainda Flui.mp3"></audio>

<!-- som de abrir carta (opcional, pode trocar depois) -->
<audio id="somAbrir" src="https://www.soundjay.com/misc/sounds/page-flip-01a.mp3"></audio>

<script>
const abrirBtn = document.getElementById("abrirBtn");
const conteudo = document.getElementById("conteudo");
const textoEl = document.getElementById("texto");
const musica = document.getElementById("musica");
const botao = document.getElementById("botao");
const fade = document.getElementById("fade");
const somAbrir = document.getElementById("somAbrir");

const mensagem = `Em poucos dias, a gente criou algo raro — e o mais bonito é sentir que isso ainda tá só começando.
Com muito carinho, P.S: fica até a música acabar`;

abrirBtn.addEventListener("click", () => {

    // vibração (se suportar)
    if (navigator.vibrate) navigator.vibrate(50);

    let senha = prompt("Digite a senha:");

    if (senha === "Aquariana") {

        abrirBtn.style.display = "none";
        document.querySelector(".carta").style.display = "none";

        somAbrir.play();

        setTimeout(() => {
            conteudo.classList.add("show");
            tocarMusica();
            digitar(mensagem);
        }, 500);

    } else {
        alert("Senha incorreta 💔");
    }
});

function tocarMusica() {
    musica.volume = 0;
    musica.play();

    let vol = 0;
    let fadeIn = setInterval(() => {
        if (vol < 1) {
            vol += 0.05;
            musica.volume = vol;
        } else {
            clearInterval(fadeIn);
        }
    }, 200);
}

function digitar(texto) {
    let i = 0;

    function escrever() {
        if (i < texto.length) {
            textoEl.innerHTML += texto[i];
            i++;

            let delay = 40;
            if (texto[i] === "." || texto[i] === ",") delay = 200;

            setTimeout(escrever, delay);
        } else {
            botao.style.display = "block";
        }
    }

    escrever();
}

botao.addEventListener("click", () => {
    fade.style.opacity = 1;

    setTimeout(() => {
        window.location.href = "https://wa.me/5542998759922?text=Eu quero continuar isso com você 💙";
    }, 2000);
});
</script>

</body>
</html>
